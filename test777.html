<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spoon Sports Pager - Final Fixed</title>
    <!-- 引入雲端即時通訊庫 (MQTT.js) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --spoon-yellow: #FFD700; --spoon-blue: #005CAF; --spoon-white: #FFFFFF; --spoon-black: #1A1A1A;
            --font-racing: "Arial Black", sans-serif;
        }
        body { font-family: var(--font-racing); margin: 0; background-color: var(--spoon-blue); height: 100vh; overflow: hidden; user-select: none; }
        
        #display-view, #control-view { display: none; height: 100vh; width: 100%; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 電視顯示端：左 30% 歷史(6格)，右 70% 大字 */
        .mode-display #display-view { display: flex; background: var(--spoon-yellow); flex-direction: row; padding: 0 4%; box-sizing: border-box; }
        .display-left { width: 30%; display: flex; flex-direction: column; justify-content: center; gap: 8px; border-right: 4px dashed var(--spoon-blue); padding-right: 3%; }
        .display-right { width: 70%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .current-number { font-size: 32vw; line-height: 0.85; color: var(--spoon-white); font-style: italic; font-weight: 900; text-shadow: 1.5vw 1.5vw 0 var(--spoon-black); letter-spacing: -1.5vw; }
        .now-serving-text { font-size: 3vw; color: var(--spoon-blue); font-weight: 900; font-style: italic; margin-bottom: -1vw; }

        .history-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: var(--spoon-white); padding: 10px; font-size: 3vw; text-align: center; border: 5px solid var(--spoon-blue); color: var(--spoon-blue); font-style: italic; font-weight: 900; border-radius: 8px; min-height: 1.2em; }
        .history-item.latest { background: var(--spoon-blue); color: var(--spoon-yellow); transform: skewX(-12deg); }

        /* 🎨 閒置待機圖片畫廊層 (點擊即可解鎖) */
        #idle-screen {
            position: fixed;
            inset: 0;
            background: var(--spoon-black);
            z-index: 1500;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            cursor: pointer;
            transition: opacity 1s ease-in-out;
        }
        #idle-screen.active {
            display: flex;
            opacity: 1;
        }
        .idle-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 控制端 */
        .mode-control #control-view { display: flex; background: var(--spoon-blue); padding: 20px; }
        .control-card { background: rgba(0,0,0,0.3); padding: 40px; border-radius: 35px; border: 3px solid var(--spoon-yellow); text-align: center; width: 95%; max-width: 800px; }
        .btn-adjust { width: 120px; height: 120px; font-size: 5rem; border-radius: 50%; border: none; background: var(--spoon-yellow); color: var(--spoon-blue); font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 0 #b39700; }
        .op-input { font-size: 7rem; width: 250px; text-align: center; color: var(--spoon-yellow); background: none; border: none; font-weight: 900; margin: 0 15px; vertical-align: middle; }
        .special-box { margin-top: 30px; padding-top: 20px; border-top: 3px dashed var(--spoon-yellow); display: flex; align-items: center; justify-content: center; gap: 15px; }
        .special-input { font-size: 2.5rem; padding: 15px; border-radius: 12px; border: 4px solid var(--spoon-yellow); width: 250px; text-align: center; font-weight: bold; }
        .btn-special-call { width: 110px; height: 90px; font-size: 2rem; border-radius: 12px; border: none; background: var(--spoon-yellow); color: var(--spoon-blue); font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #b39700; font-style: italic; }
        .btn-call { width: 100%; padding: 35px; font-size: 3.5rem; background: var(--spoon-yellow); border: none; border-radius: 20px; font-weight: 900; font-style: italic; margin-top: 25px; box-shadow: 0 12px 0 #b39700; cursor: pointer; }
        .btn-clear-history { background: none; border: 2px solid #ff4444; color: #ff4444; padding: 12px 25px; margin-top: 25px; border-radius: 10px; cursor: pointer; font-weight: 900; font-size: 1.4rem; }

        .setup-overlay { position: fixed; inset: 0; background: var(--spoon-black); z-index: 2000; display: flex; flex-direction: column; gap: 30px; align-items: center; justify-content: center; }
        .btn-setup { width: 450px; padding: 35px; font-size: 2rem; cursor: pointer; border-radius: 20px; border: none; font-weight: 900; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        .animate-call { animation: flash 0.3s 3; }
    </style>
</head>
<body>

    <div id="setupOverlay" class="setup-overlay">
        <h1 style="color: white; font-style: italic;">SPOON SPORTS PAGER</h1>
        <button class="btn-setup" style="background: var(--spoon-yellow);" onclick="initApp('display')">啟動：電視顯示端</button>
        <button class="btn-setup" style="background: var(--spoon-white);" onclick="initApp('control')">啟動：收銀櫃檯端</button>
    </div>

    <!-- 🎨 閒置待機圖片畫廊層 -->
    <div id="idle-screen">
        <img id="idleImageElement" class="idle-img" src="" alt="Idle Showcase">
    </div>

    <div id="display-view">
        <div class="display-left">
            <div style="font-size: 1.5vw; color: var(--spoon-blue); font-weight: 900; text-align: center;">HISTORY / 履歷</div>
            <ul class="history-list" id="historyLog"></ul>
        </div>
        <div class="display-right">
            <div class="now-serving-text">NOW SERVING / 受付中</div>
            <div class="current-number" id="bigNumber">---</div>
        </div>
    </div>

    <div id="control-view">
        <div class="control-card">
            <div style="display: flex; align-items: center; justify-content: center;">
                <button class="btn-adjust" onclick="change(-1)">−</button>
                <input type="number" class="op-input" id="numInput" value="1" readonly>
                <button class="btn-adjust" onclick="change(1)">+</button>
            </div>
            <div class="special-box">
                <input type="text" id="specialInput" class="special-input" placeholder="特別號碼">
                <button class="btn-special-call" onclick="callSpecial()">CALL</button>
            </div>
            <button class="btn-call" onclick="triggerCall(true)">GO! NEXT</button>
            <br>
            <button class="btn-clear-history" onclick="requestClear()">CLEAR HISTORY / 清除歷史</button>
        </div>
    </div>

<script>
    // 🌐 雲端頻道設定
    const CLOUD_CHANNEL = 'spoon_sports_pager_shop_bboy0908';
    
    // 1. 同一裝置分頁廣播備用
    const bc = new BroadcastChannel('spoon_v14_fixed');
    
    // 2. 雲端 MQTT WebSocket 連線
    const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    mqttClient.on('connect', () => {
        console.log('雲端跨裝置連線成功！');
        mqttClient.subscribe(CLOUD_CHANNEL);
    });

    mqttClient.on('message', (topic, message) => {
        if (topic === CLOUD_CHANNEL) {
            try {
                const data = JSON.parse(message.toString());
                handleSignal(data);
            } catch(e) {}
        }
    });

    bc.onmessage = (ev) => handleSignal(ev.data);

    function broadcastSignal(msg) {
        bc.postMessage(msg);
        if (mqttClient.connected) {
            mqttClient.publish(CLOUD_CHANNEL, JSON.stringify(msg));
        }
    }

    const input = document.getElementById('numInput');
    const specialInput = document.getElementById('specialInput');
    const bigNumber = document.getElementById('bigNumber');
    const historyLog = document.getElementById('historyLog');
    const idleScreen = document.getElementById('idle-screen');
    const idleImageElement = document.getElementById('idleImageElement');
    
    let logs = [];
    let audioCtx = null;
    let wakeLock = null;
    let idleTimer = null;
    let imageRotationTimer = null;
    let currentUtterances = [];
    let currentMode = '';

    // 🎨 設定您繪畫的圖片清單
    const idleImages = [
        'sleep.jpeg'
    ];
    let currentImageIndex = 0;
    const IDLE_TIMEOUT_MS = 5 * 60 * 1000; // 5 分鐘無叫號觸發待機
    const IMAGE_SWITCH_MS = 15 * 1000;     // 多張圖片時每 15 秒輪播一張

    // 💡 觸控解鎖：點擊待機圖片時立刻關閉圖片並重新倒數 5 分鐘
    idleScreen.addEventListener('click', resetIdleTimer);

    function resetIdleTimer() {
        idleScreen.classList.remove('active');
        clearInterval(imageRotationTimer);
        if (idleTimer) clearTimeout(idleTimer);
        
        // 僅有在電視顯示端才啟用 5 分鐘倒數
        if (currentMode === 'display') {
            idleTimer = setTimeout(() => {
                showIdleScreen();
            }, IDLE_TIMEOUT_MS);
        }
    }

    function showIdleScreen() {
        // 嚴格限制：只有電視顯示端才會彈出待機圖片
        if (currentMode === 'display' && idleImages.length > 0) {
            changeIdleImage();
            idleScreen.classList.add('active');
            if (idleImages.length > 1) {
                imageRotationTimer = setInterval(changeIdleImage, IMAGE_SWITCH_MS);
            }
        }
    }

    function changeIdleImage() {
        idleImageElement.src = idleImages[currentImageIndex];
        currentImageIndex = (currentImageIndex + 1) % idleImages.length;
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                document.addEventListener('visibilitychange', async () => {
                    if (wakeLock !== null && document.visibilityState === 'visible') {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                });
            } catch (err) {
                console.error(`防鎖屏啟動失敗: ${err.name}, ${err.message}`);
            }
        }
    }

    function numberToEnglish(n) {
        const num = parseInt(n, 10);
        if (isNaN(num)) return n;
        
        const units = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 
                       'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
        const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

        if (num === 0) return 'zero';
        if (num < 20) return units[num];
        if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? ' ' + units[num % 10] : '');
        if (num < 1000) {
            const rest = num % 100;
            return units[Math.floor(num / 100)] + ' hundred' + (rest !== 0 ? ' ' + numberToEnglish(rest) : '');
        }
        return num.toString();
    }

    // Base64 音效完整數據

    async function playCrystalChime() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        try {
            const response = await fetch(chimeBase64);
            const arrayBuffer = await response.arrayBuffer();
            audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            });
        } catch (e) {
            console.error("鈴聲播放失敗:", e);
        }
    }

    function initApp(mode) {
        currentMode = mode;
        
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        requestWakeLock();
        
        if (mode === 'display') {
            resetIdleTimer();
        } else {
            // 若切換為收銀端，確保清除待機狀態與計時器
            idleScreen.classList.remove('active');
            if (idleTimer) clearTimeout(idleTimer);
            clearInterval(imageRotationTimer);
        }

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); 
        document.getElementById('setupOverlay').style.display = 'none';
        document.body.className = 'mode-' + mode;
        updateHistoryUI();
    }

    function change(v) { input.value = Math.max(1, parseInt(input.value) + v); }
    function triggerCall(inc) { broadcastSignal({ type: 'call', num: input.value }); if(inc) change(1); }
    function callSpecial() { if(specialInput.value.trim()){ broadcastSignal({ type: 'call', num: specialInput.value }); specialInput.value = ""; } }
    function requestClear() { if(confirm("確定清除歷史紀錄？")) broadcastSignal({ type: 'clear' }); }

    function updateHistoryUI() {
        const items = logs.slice(1, 7).concat(Array(6).fill("-")).slice(0, 6);
        historyLog.innerHTML = items.map((n, i) => 
            `<li class="history-item ${i===0 && n!=='-'?'latest':''}">${n}</li>`
        ).join('');
    }

    function handleSignal(data) {
        resetIdleTimer();

        if (data.type === 'clear') { logs = []; bigNumber.innerText = "---"; updateHistoryUI(); return; }

        const val = data.num;
        bigNumber.innerText = val;
        
        if (logs[0] !== val) {
            logs.unshift(val);
            if (logs.length > 15) logs.pop();
            updateHistoryUI();
        }

        bigNumber.classList.remove('animate-call');
        void bigNumber.offsetWidth;
        bigNumber.classList.add('animate-call');

        // 僅電視顯示端發出音效與語音
        if (currentMode === 'display') {
            playCrystalChime();

            setTimeout(() => {
                window.speechSynthesis.cancel();
                currentUtterances = [];

                const callNum = val.toString();

                const msgHK = new SpeechSynthesisUtterance(callNum + " 號，請取餐");
                const voices = window.speechSynthesis.getVoices();
                const hkVoice = voices.find(v => v.lang === 'zh-HK' && v.name.includes('Premium')) || 
                                voices.find(v => v.lang.includes('HK')) || 
                                voices.find(v => v.lang.includes('zh'));
                
                if (hkVoice) msgHK.voice = hkVoice;
                msgHK.lang = 'zh-HK';
                msgHK.rate = 0.92;
                msgHK.volume = 1.0;

                const englishText = numberToEnglish(callNum);
                const msgEN = new SpeechSynthesisUtterance("Number " + englishText + ", please collect your meal");
                msgEN.lang = 'en-US';
                msgEN.volume = 0.55;
                msgEN.rate = 0.95;

                currentUtterances.push(msgHK, msgEN);

                msgHK.onend = () => {
                    setTimeout(() => {
                        window.speechSynthesis.speak(msgEN);
                    }, 300);
                };

                window.speechSynthesis.speak(msgHK);
            }, 3700); 
        }
    }
</script>
